name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # ВОТ ЗДЕСЬ МЫ ПЕРЕИМЕНОВЫВАЕМ ФАЙЛ
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ModChest.apk
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModChest
          path: dist/ModChest.apk
